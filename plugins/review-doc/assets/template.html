<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{DOC_TITLE}}</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#111827; --ink2:#374151; --muted:#6b7280; --line:#e5e7eb; --soft:#f3f4f6;
    --accent:#2563eb; --accent-weak:#eff6ff;
    --ok:#15803d; --ok-weak:#f0fdf4; --ok-bd:#bbf7d0;
    --no:#b91c1c; --no-weak:#fef2f2; --no-bd:#fecaca;
    --cmt:#0e7490;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--ink); background:var(--bg);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",Roboto,sans-serif;
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .wrap{max-width:760px; margin:0 auto; padding:0 16px calc(96px + env(safe-area-inset-bottom))}

  /* top bar */
  .bar{
    position:sticky; top:0; z-index:10; margin:0 -16px 4px;
    background:rgba(246,247,249,.9); backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top));
  }
  .progress{display:flex; gap:12px; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; margin-right:auto}
  .progress b{font-weight:700}
  .progress .p-ok b{color:var(--ok)} .progress .p-no b{color:var(--no)} .progress .p-cm b{color:var(--cmt)}
  button{
    font:inherit; font-size:14px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent;
    border:1px solid var(--line); background:var(--card); color:var(--ink2);
    min-height:40px; padding:0 14px; border-radius:10px;
  }
  button.primary{background:var(--ink); color:#fff; border-color:var(--ink)}
  button.ghost{background:transparent; border-color:transparent; color:var(--muted)}

  h1.doc{font-size:24px; line-height:1.35; margin:22px 0 6px; letter-spacing:-.02em}
  .doc-sub{color:var(--muted); margin:0 0 18px; font-size:15px}

  /* items */
  .ritem{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 18px 16px; margin:12px 0; position:relative; scroll-margin-top:72px;
  }
  .ritem::before{content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:0 3px 3px 0; background:transparent}
  .ritem.has-comment::before{background:var(--cmt)}
  .ritem.status-approved{border-color:var(--ok-bd)} .ritem.status-approved::before{background:var(--ok)}
  .ritem.status-rejected{border-color:var(--no-bd)} .ritem.status-rejected::before{background:var(--no)}
  .ritem__title{font-size:18px; line-height:1.45; font-weight:700; margin:0 0 8px; letter-spacing:-.01em}
  .ritem__title .tag{display:inline-block; vertical-align:2px; margin-left:6px; font-size:12px; font-weight:600; color:var(--accent); background:var(--accent-weak); padding:2px 8px; border-radius:999px}
  .ritem__body{color:var(--ink2); font-size:16px}
  .ritem__body p{margin:.45em 0}
  .ritem__body ul,.ritem__body ol{margin:.45em 0; padding-left:1.25em}
  .ritem__body li{margin:.3em 0}
  .ritem__body code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.88em; background:var(--soft); padding:1px 5px; border-radius:5px}
  .ritem__body pre{background:var(--soft); border-radius:10px; padding:12px 14px; overflow:auto; font-size:14px; line-height:1.55}
  .ritem__body pre code{background:none; padding:0}
  .ritem__body table{border-collapse:collapse; font-size:14px; display:block; overflow-x:auto}
  .ritem__body td,.ritem__body th{border:1px solid var(--line); padding:6px 9px; text-align:left}

  /* verdict + comment */
  .cmt{margin-top:14px; padding-top:14px; border-top:1px solid var(--soft)}
  .verdict{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px}
  .sb{min-height:44px; border-radius:11px; font-size:15px; color:var(--muted); background:var(--card)}
  .status-approved .sb--ok{background:var(--ok); border-color:var(--ok); color:#fff}
  .status-rejected .sb--no{background:var(--no); border-color:var(--no); color:#fff}
  @media (hover:hover){
    .sb--ok:hover{border-color:var(--ok-bd); background:var(--ok-weak); color:var(--ok)}
    .sb--no:hover{border-color:var(--no-bd); background:var(--no-weak); color:var(--no)}
    .status-approved .sb--ok:hover{background:var(--ok); color:#fff}
    .status-rejected .sb--no:hover{background:var(--no); color:#fff}
    button.primary:hover{opacity:.9}
  }
  textarea{
    display:block; width:100%; min-height:48px; resize:none; overflow:hidden;
    font:inherit; font-size:16px; line-height:1.55; color:var(--ink); background:var(--soft);
    border:1px solid transparent; border-radius:11px; padding:11px 12px;
  }
  textarea::placeholder{color:#9ca3af}
  textarea:focus{outline:none; background:var(--card); border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak)}

  .note{font-size:13px; color:var(--muted); margin:8px 0 0}
  .toast{
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(16px);
    background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px;
    font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:.22s; max-width:calc(100% - 32px);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (min-width:720px){
    body{font-size:15px}
    .ritem{padding:20px 22px 18px}
    .ritem__body{font-size:15px}
    .verdict{display:flex; width:auto}
    .sb{min-height:36px; padding:0 16px; font-size:14px}
    h1.doc{font-size:26px}
  }
</style>
</head>
<body data-doc-id="{{DOC_ID}}" data-doc-title="{{DOC_TITLE}}" data-lang="{{LANG}}">
<div class="wrap">

  <div class="bar">
    <div class="progress">
      <span class="p-ok">✓ <b id="cOk">0</b></span>
      <span class="p-no">✗ <b id="cNo">0</b></span>
      <span class="p-cm">💬 <b id="cCm">0</b></span>
      <span>/ <span id="total">0</span></span>
    </div>
    <button class="ghost" id="clearBtn"></button>
    <button class="primary" id="copyBtn"></button>
  </div>

  <h1 class="doc">{{DOC_TITLE}}</h1>
  <p class="doc-sub">{{GENERATED}}</p>
  <p class="note" id="storeNote" hidden></p>

  {{ITEMS}}

</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var I18N = {
    ko: {
      copy:"결과 복사", clear:"초기화",
      approve:"✓ 승인", reject:"✗ 거절", cmtPlaceholder:"코멘트 (선택)",
      exportTitle:"검토 결과 — ", bOk:" — ✅ 승인", bNo:" — ❌ 거절", bCm:" — 💬 코멘트",
      empty:"_(승인/거절·코멘트 없음)_", copied:"검토 결과 복사됨", copyFail:"복사 실패 — 수동 복사",
      confirmClear:"모든 승인/거절·코멘트를 삭제할까요?", cleared:"초기화됨",
      noStore:"이 환경에서는 브라우저 저장이 막혀 있어 새로고침하면 입력이 사라집니다. 끝나면 '결과 복사'로 가져가세요."
    },
    en: {
      copy:"Copy results", clear:"Reset",
      approve:"✓ Approve", reject:"✗ Reject", cmtPlaceholder:"Comment (optional)",
      exportTitle:"Review results — ", bOk:" — ✅ Approved", bNo:" — ❌ Rejected", bCm:" — 💬 Comment",
      empty:"_(no verdicts or comments)_", copied:"Results copied", copyFail:"Copy failed — copy manually",
      confirmClear:"Clear all verdicts and comments?", cleared:"Cleared",
      noStore:"Browser storage is blocked here; input is lost on reload. Use 'Copy results' when done."
    }
  };
  var T = I18N[document.body.dataset.lang] || I18N.en;

  // Storage that never throws: file:// viewers and sandboxed frames can block localStorage,
  // and one exception would stop the loop below after the first item.
  var mem = {}, persistent = true;
  var store = {
    get:function(k){ try{ return window.localStorage.getItem(k); }catch(e){ persistent=false; return k in mem ? mem[k] : null; } },
    set:function(k,v){ mem[k]=v; try{ window.localStorage.setItem(k,v); }catch(e){ persistent=false; } },
    del:function(k){ delete mem[k]; try{ window.localStorage.removeItem(k); }catch(e){ persistent=false; } }
  };

  var DOC_ID = document.body.dataset.docId || "doc";
  var DOC_TITLE = document.body.dataset.docTitle || document.title;
  document.getElementById("copyBtn").textContent = T.copy;
  document.getElementById("clearBtn").textContent = T.clear;
  var Kc = function(id){ return "reviewdoc:" + DOC_ID + ":" + id; };
  var Ks = function(id){ return "reviewdoc:" + DOC_ID + ":" + id + ":status"; };
  var items = Array.prototype.slice.call(document.querySelectorAll(".ritem"));
  var cOk=document.getElementById("cOk"), cNo=document.getElementById("cNo"), cCm=document.getElementById("cCm");
  document.getElementById("total").textContent = items.length;

  function autosize(ta){ ta.style.height="auto"; ta.style.height=(ta.scrollHeight+2)+"px"; }
  function refresh(){
    var ok=0,no=0,cm=0;
    items.forEach(function(s){
      if(s.classList.contains("status-approved")) ok++;
      if(s.classList.contains("status-rejected")) no++;
      if(s.classList.contains("has-comment")) cm++;
    });
    cOk.textContent=ok; cNo.textContent=no; cCm.textContent=cm;
  }

  items.forEach(function(sec, i){
    var id = sec.id || ("item-"+(i+1)); sec.id = id;
    var titleEl = sec.querySelector(".ritem__title");
    sec.dataset.title = sec.dataset.title || (titleEl ? titleEl.textContent.trim() : id);

    var box = document.createElement("div");
    box.className = "cmt";
    var verdict = document.createElement("div"); verdict.className = "verdict";
    [["approve","sb sb--ok",T.approve],["reject","sb sb--no",T.reject]].forEach(function(b){
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = b[1]; btn.dataset.act = b[0]; btn.textContent = b[2];
      verdict.appendChild(btn);
    });
    var ta = document.createElement("textarea");
    ta.rows = 1; ta.placeholder = T.cmtPlaceholder;
    box.appendChild(verdict); box.appendChild(ta);
    sec.appendChild(box);

    var savedC = store.get(Kc(id)) || "";
    ta.value = savedC;
    if(savedC.trim()) sec.classList.add("has-comment");
    var savedS = store.get(Ks(id));
    if(savedS==="approve") sec.classList.add("status-approved");
    if(savedS==="reject") sec.classList.add("status-rejected");

    ta.addEventListener("input", function(){
      var v=ta.value;
      if(v.trim()){ store.set(Kc(id),v); sec.classList.add("has-comment"); }
      else{ store.del(Kc(id)); sec.classList.remove("has-comment"); }
      autosize(ta); refresh();
    });
    requestAnimationFrame(function(){ autosize(ta); });

    verdict.querySelectorAll(".sb").forEach(function(btn){
      btn.addEventListener("click", function(){
        var act = btn.dataset.act;
        var cls = act==="approve" ? "status-approved" : "status-rejected";
        var cur = sec.classList.contains(cls);
        sec.classList.remove("status-approved","status-rejected");
        if(cur){ store.del(Ks(id)); }
        else{ sec.classList.add(cls); store.set(Ks(id), act); }
        refresh();
      });
    });
  });
  refresh();
  if(!persistent){ var n=document.getElementById("storeNote"); n.textContent=T.noStore; n.hidden=false; }

  function toast(msg){
    var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove("show"); },1800);
  }

  function buildExport(){
    var L=["# " + T.exportTitle + DOC_TITLE, ""], any=false;
    items.forEach(function(sec, i){
      var st = store.get(Ks(sec.id));
      var c = (store.get(Kc(sec.id))||"").trim();
      if(!st && !c) return;
      any=true;
      var badge = st==="approve" ? T.bOk : st==="reject" ? T.bNo : T.bCm;
      L.push("## [" + (i+1) + "] " + sec.dataset.title + "  (#" + sec.id + ")" + badge);
      if(c) L.push(c);
      L.push("");
    });
    if(!any) L.push(T.empty);
    return L.join("\n").trim()+"\n";
  }

  document.getElementById("copyBtn").addEventListener("click", function(){
    var text=buildExport();
    function done(){ toast(T.copied); }
    function fb(){
      var ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
      ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy") ? done() : toast(T.copyFail); }catch(e){ toast(T.copyFail); }
      document.body.removeChild(ta);
    }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fb); }
      else fb();
    }catch(e){ fb(); }
  });

  document.getElementById("clearBtn").addEventListener("click", function(){
    if(!confirm(T.confirmClear)) return;
    items.forEach(function(sec){
      store.del(Kc(sec.id)); store.del(Ks(sec.id));
      sec.classList.remove("has-comment","status-approved","status-rejected");
      var ta=sec.querySelector("textarea"); if(ta){ ta.value=""; autosize(ta); }
    });
    refresh(); toast(T.cleared);
  });
})();
</script>
</body>
</html>
